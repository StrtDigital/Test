<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEYRA — Badges & Pills</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>body{padding:2.5rem}.set{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:1rem 0}</style></head>
<body>
  <span class="eyebrow">Components</span>
  <h1 style="font-size:2rem">Badges, chips & ratings</h1>
  <div class="set"><span class="badge">Bestseller</span><span class="badge badge--new">New</span><span class="badge badge--sale">Sale</span><span class="badge badge--soft">Default</span></div>
  <div class="set"><span class="chip">Wool Coat<button>✕</button></span><span class="chip">Size M<button>✕</button></span><span class="chip">On sale<button>✕</button></span></div>
  <div class="set"><span class="stars">★★★★★</span><span class="stars">★★★★☆</span><span class="muted">4.6 · 128 reviews</span></div>
  <div class="set"><span class="status-pill delivered">Delivered</span><span class="status-pill transit">Processing</span></div>
</body></html>
