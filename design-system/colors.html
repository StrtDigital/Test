<!-- @dsCard group="Foundations" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEYRA — Colour</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{padding:2.5rem}
  .pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;margin-top:1.5rem}
  .sw{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .sw .chip{height:90px}
  .sw .meta{padding:.7rem .8rem;font-size:.78rem}
  .sw .meta b{display:block;font-size:.85rem}
  .sw .meta span{color:var(--text-soft)}
</style></head>
<body>
  <span class="eyebrow">Foundations</span>
  <h1 style="font-size:2rem">Colour</h1>
  <p class="muted">Ink + paper base with a warm clay accent and supporting tones.</p>
  <div class="pal">
    <div class="sw"><div class="chip" style="background:#14110f"></div><div class="meta"><b>Ink</b><span>#14110F · text / surfaces</span></div></div>
    <div class="sw"><div class="chip" style="background:#f7f4ef"></div><div class="meta"><b>Paper</b><span>#F7F4EF · background</span></div></div>
    <div class="sw"><div class="chip" style="background:#efe9e1"></div><div class="meta"><b>Paper 2</b><span>#EFE9E1 · raised</span></div></div>
    <div class="sw"><div class="chip" style="background:#b1553a"></div><div class="meta"><b>Clay (accent)</b><span>#B1553A · primary CTA</span></div></div>
    <div class="sw"><div class="chip" style="background:#6f7a5a"></div><div class="meta"><b>Sage</b><span>#6F7A5A · secondary</span></div></div>
    <div class="sw"><div class="chip" style="background:#c9a24b"></div><div class="meta"><b>Gold</b><span>#C9A24B · highlight</span></div></div>
    <div class="sw"><div class="chip" style="background:#4f7d52"></div><div class="meta"><b>OK</b><span>#4F7D52 · success</span></div></div>
    <div class="sw"><div class="chip" style="background:#e2dbd0"></div><div class="meta"><b>Line</b><span>#E2DBD0 · borders</span></div></div>
  </div>
</body></html>
